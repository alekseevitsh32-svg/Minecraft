name: Build EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate assets
        run: python tools/generate_assets.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MinecraftS --add-data "assets;assets" --icon "assets/textures/menu/icon.ico" MinecraftS.py

      - name: Show output
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftS-windows
          path: dist/MinecraftS.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MinecraftS.exe
          generate_release_notes: true
